name: Validate attendance system
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: attendance_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U attendance" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements-dev.txt
      - run: .venv/bin/python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://attendance:ci-test-only-password@localhost:5432/attendance_test
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - working-directory: scanner
        run: flutter pub get --enforce-lockfile
      - working-directory: scanner
        run: flutter analyze
      - working-directory: scanner
        run: flutter test
      - working-directory: scanner
        run: flutter build apk --debug
